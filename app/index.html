<!-- Se aplica el tema antes de pintar nada para que abrir en
     oscuro no dé un fogonazo blanco -->
<script>
(function(){
  try {
    var t = localStorage.getItem('luckstudio_tema') || 'auto';
    document.documentElement.dataset.tema = t;
    var oscuro = t === 'oscuro' ||
      (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.querySelector('meta[name="theme-color"]').content =
      oscuro ? '#121418' : '#F3F2EE';
  } catch (e) {}
})();
</script>

<!-- ============================================================
     RED DE SEGURIDAD

     Si el JavaScript no llega a arrancar, la página se queda
     visible pero muerta y sin ninguna pista de por qué. Esto lo
     detecta, dice qué ha pasado de verdad y ofrece repararlo.

     Cuidado con los falsos positivos: en una conexión lenta la
     app puede tardar en arrancar sin que nada esté roto. Por eso
     el aviso por tiempo espera de sobra, comprueba antes si la
     app ya ha pintado algo, y desaparece solo si acaba llegando.
     ============================================================ -->
<script>
(function () {
  var arrancado = false;
  var motivo = null;

  window.addEventListener('lista-lista', function () {
    arrancado = true;
    var n = document.getElementById('fallo-carga');
    if (n) n.remove();          /* llegó tarde, pero llegó */
  });

  /* Errores de ejecución: lo más útil para saber qué pasa */
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      mostrar('No se pudo descargar un archivo',
              (e.target.src || 'script') + '\n\nSuele ser un archivo que falta ' +
              'en el servidor, o que se entrega con el tipo equivocado.');
      return;
    }
    if (e.message) {
      motivo = e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : '');
      mostrar('Error al ejecutar el código', motivo);
    }
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    motivo = 'Promesa rechazada: ' + (e.reason && (e.reason.message || e.reason));
    mostrar('Error al arrancar', motivo);
  });

  /* Aviso por tiempo, solo si de verdad no hay nada pintado */
  setTimeout(function () {
    if (arrancado) return;
    var grid = document.getElementById('v-grid');
    if (grid && grid.children.length) return;   /* está funcionando */
    mostrar('La app no ha llegado a arrancar',
            motivo || 'No ha dado ningún error, así que puede ser una conexión ' +
            'muy lenta o un archivo a medias en la caché. Prueba a reparar; si ' +
            'vuelve a pasar, revisa que estén subidos todos los archivos y el .htaccess.');
  }, 15000);

  function mostrar(titulo, detalle) {
    if (arrancado || document.getElementById('fallo-carga')) return;

    var n = document.createElement('div');
    n.id = 'fallo-carga';
    n.innerHTML =
      '<h2>' + titulo + '</h2>' +
      '<pre id="fallo-detalle"></pre>' +
      '<button id="fallo-reparar">Borrar caché y reintentar</button>' +
      '<button id="fallo-copiar" class="fallo-sec">Copiar el error</button>' +
      '<button id="fallo-cerrar" class="fallo-sec">Cerrar este aviso</button>' +
      '<p class="fallo-pista">Comprueba que están subidos todos los archivos ' +
      'del ZIP, incluido el <b>.htaccess</b>, que es el que hace que el ' +
      'servidor entregue los .js como text/javascript.</p>';
    document.body.appendChild(n);
    document.getElementById('fallo-detalle').textContent = detalle;

    document.getElementById('fallo-cerrar').onclick = function () { n.remove(); };

    document.getElementById('fallo-copiar').onclick = function () {
      var t = titulo + '\n' + detalle + '\n' + navigator.userAgent;
      if (navigator.clipboard) navigator.clipboard.writeText(t);
      this.textContent = 'Copiado';
    };

    document.getElementById('fallo-reparar').onclick = function () {
      this.textContent = 'Limpiando…';
      var fin = function () { location.reload(); };
      var tareas = [];
      try {
        if (window.caches) {
          tareas.push(caches.keys().then(function (k) {
            return Promise.all(k.map(function (x) { return caches.delete(x); }));
          }));
        }
        if (navigator.serviceWorker) {
          tareas.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        Promise.all(tareas).then(fin, fin);
        setTimeout(fin, 3000);          /* pase lo que pase, se recarga */
      } catch (e) { fin(); }
    };
  }
})();
</script>
