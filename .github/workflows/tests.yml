name: Pruebas
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: for t in tests/*.test.mjs; do node "$t" || exit 1; done
      - name: Versiones y precarga coherentes
        run: python3 app/versionar.py "$(grep -o 'v=[0-9]*' app/index.html | head -1 | cut -d= -f2)"
